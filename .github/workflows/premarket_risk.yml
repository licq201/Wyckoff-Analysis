name: Premarket Risk

on:
  # 主路径：Codex Automation 在工作日北京时间 08:20 调用 workflow_dispatch，此时 VIX 已随美股
  # 收盘稳定超过 1 小时，且给 09:30 开盘留出缓冲。Actions 页面仍可手动补跑。
  #
  # 兜底：schedule 在工作日北京时间 08:15（UTC 00:15）触发，带 --backstop 幂等短路。
  # 兜底模式或开盘后（>=09:30）运行仅落库供 Step4 消费，自动静默跳过飞书推送，避免收盘或盘中误发卡片。
  schedule:
    - cron: "15 0 * * 1-5"
  workflow_dispatch:

concurrency:
  # 不取消在跑的任务：延迟的 schedule 兜底一旦排到 workflow_dispatch 前面就会把主路径掐掉。
  # 排队等待反而自洽——兜底轮到自己时会读到主路径已写好的盘前态，直接短路退出。
  group: premarket-risk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      WYCKOFF_WRITE_CONTEXT: "server_job"
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      PREMARKET_VIX_POLL_INTERVAL_SECONDS: "300"
      PREMARKET_LLM_PROVIDER: ${{ vars.PREMARKET_LLM_PROVIDER || secrets.PREMARKET_LLM_PROVIDER || 'efficiency' }}
      PREMARKET_LLM_FALLBACK_PROVIDERS: ${{ vars.PREMARKET_LLM_FALLBACK_PROVIDERS || secrets.PREMARKET_LLM_FALLBACK_PROVIDERS || '' }}
      EFFICIENCY_API_KEY: ${{ secrets.EFFICIENCY_API_KEY }}
      EFFICIENCY_MODEL: ${{ vars.EFFICIENCY_MODEL || secrets.EFFICIENCY_MODEL }}
      EFFICIENCY_BASE_URL: ${{ vars.EFFICIENCY_BASE_URL || secrets.EFFICIENCY_BASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Prepare logs dir
        run: mkdir -p logs

      - name: Run premarket risk job
        env:
          BACKSTOP: ${{ github.event_name == 'schedule' && '--backstop' || '' }}
        run: |
          set -o pipefail
          python -u scripts/premarket_risk_job.py --logs ${{ github.workspace }}/logs/premarket_risk.log $BACKSTOP \
            2>&1 | tee -a ${{ github.workspace }}/logs/premarket_risk.console.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: premarket-risk-logs-${{ github.run_number }}
          path: logs/premarket_risk*.log
          retention-days: 7
          if-no-files-found: warn
